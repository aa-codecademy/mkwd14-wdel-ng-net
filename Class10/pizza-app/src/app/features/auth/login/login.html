<form class="form" [formGroup]="loginForm" (ngSubmit)="onSubmit()">
    <h1>Log in</h1>

    <mat-form-field>
        <mat-label>Username</mat-label>
        <input matInput formControlName="userName" />
        @if(loginForm.controls.userName.hasError('required')) {
        <mat-error>The username is required</mat-error>
        }
    </mat-form-field>

    <mat-form-field>
        <mat-label>Password</mat-label>
        <input matInput formControlName="password" />
        @if(loginForm.controls.password.hasError('required')) {
        <mat-error>The password is required</mat-error>
        }
    </mat-form-field>

    <button matButton="filled" type="submit">Log in</button>
</form>
