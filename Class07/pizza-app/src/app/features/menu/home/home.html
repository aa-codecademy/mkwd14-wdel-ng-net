<section class="hero">
    <!-- priority: the logo is the first big image, so the browser loads it straight away -->
    <img ngSrc="images/pizza-maker-logo.png" width="840" height="630" priority alt="Pizza Maker" />
    <a matButton="filled" routerLink="/pizza-maker">Make your own pizza</a>
</section>

<h1>Not sure what to choose? Start from one of our favourites</h1>

<div class="menu">
    @for (pizza of menu; track $index) {
    <mat-card>
        <img mat-card-image [ngSrc]="pizza.image" [width]="pizza.imageWidth" [height]="pizza.imageHeight"
            [alt]="pizza.name" />

        <mat-card-header>
            <mat-card-title>{{ pizza.name }}</mat-card-title>
        </mat-card-header>

        <mat-card-content>
            <p>{{ pizza.description }}</p>
            <mat-chip-set aria-label="Ingredients">
                @for (ingredient of pizza.ingredients; track ingredient) {
                <mat-chip>{{ ingredient }}</mat-chip>
                }
            </mat-chip-set>
        </mat-card-content>

    </mat-card>
    }
</div>
